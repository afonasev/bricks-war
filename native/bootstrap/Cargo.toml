[package]
name = "bricks-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# QA binaries use an explicitly compiled ephemeral key and fault injection.
# Production binaries have neither a key override nor fault injection.
fixture = []

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pem"] }
fs2 = "0.4"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
base64 = "0.22"
sha2 = "0.10"
