<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b18" />
    <meta name="description" content="Локальная Tetris-арена для людей и ИИ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bricks War" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=__BRICKS_WAR_ASSET_REVISION__" />
    <link rel="icon" href="__BRICKS_WAR_FAVICON__" />
    <title>Bricks War — локальная Tetris-арена</title>
    <style>
      body { margin: 0; background: #fff8eb; }
      #startup-loading { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; overflow: hidden; background: #fff8eb; color: #193f73; font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif; }
      #startup-loading > picture { position: absolute; inset: 0; }
      .startup-loading-backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .startup-loading-content { position: relative; display: grid; justify-items: center; width: min(76vw, 720px); text-align: center; transform: translateY(-3vh); }
      .startup-loading-logo { display: block; width: min(58vw, 670px); margin: 0; padding: 0; font-size: 0; line-height: 0; filter: none; text-shadow: none; }
      .startup-loading-logo img { display: block; width: 100%; height: auto; }
      .startup-loading-status { margin: clamp(24px, 5vh, 52px) 0 16px; font-size: clamp(17px, 1.6vw, 23px); font-weight: 800; }
      .startup-loading-indicator { display: flex; gap: 7px; }
      .startup-loading-footer { position: absolute; inset: auto 0 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); background: #fff8ebde; color: #526a86; font-size: 12px; font-weight: 800; line-height: 1.4; text-align: center; }
      .startup-loading-indicator i { width: 18px; height: 18px; border: 1px solid #93b62c; border-radius: 4px; background: #bbda47; box-shadow: 0 2px 0 #7a922b55; animation: startup-loading-pulse 1.2s ease-in-out infinite; }
      .startup-loading-indicator i:nth-child(2) { animation-delay: .1s; } .startup-loading-indicator i:nth-child(3) { animation-delay: .2s; } .startup-loading-indicator i:nth-child(4) { animation-delay: .3s; } .startup-loading-indicator i:nth-child(5) { animation-delay: .4s; } .startup-loading-indicator i:nth-child(6) { animation-delay: .5s; }
      @keyframes startup-loading-pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
      @media (max-width: 600px) { .startup-loading-content { width: 86vw; } .startup-loading-logo { width: min(86vw, 390px); } .startup-loading-backdrop { object-position: 50% 50%; } }
      @media (max-width: 600px) { .startup-loading-footer { padding-inline: 12px; font-size: 11px; } }
      @media (max-height: 480px) and (min-width: 601px) { .startup-loading-logo { width: min(54vw, 64vh); } .startup-loading-status { margin-top: 24px; } }
      @media (prefers-reduced-motion: reduce) { .startup-loading-indicator i { animation: none; } }
    </style>
  </head>
  <body>
    <section id="startup-loading" role="status" aria-live="polite" aria-label="Загружаем Bricks War">
      <picture aria-hidden="true"><source media="(max-width: 600px)" srcset="/src/assets/loading/workshop-portrait.jpg" /><img class="startup-loading-backdrop" src="/src/assets/loading/workshop.jpg" alt="" aria-hidden="true" fetchpriority="high" /></picture>
      <div class="startup-loading-content">
        <h1 class="startup-loading-logo" aria-label="Bricks War"><img src="/src/assets/brand/concept-logo.webp" alt="" aria-hidden="true" fetchpriority="high" /></h1>
        <p class="startup-loading-status">Загружаем игру</p>
        <div class="startup-loading-indicator" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <footer class="startup-loading-footer">© 2026 Evgeniy Afonasev · afonasev.tech · Made with Codex</footer>
    </section>
    <div id="app" inert aria-busy="true"></div>
    <noscript>Для запуска Bricks War включите JavaScript.</noscript>
    <script>
      const initialLoading = document.getElementById('startup-loading');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (initialLoading?.isConnected) initialLoading.dataset.shownAt = String(performance.now());
      }));
      if (window.location.protocol === 'file:' && !window.location.pathname.includes('/dist/')) {
        window.location.replace(new URL('./dist/index.html', window.location.href).href);
      }
    </script>
    <script type="module">
      const root = document.querySelector('#app');
      const showStartupError = (error) => {
        if (!root) return;
        document.getElementById('startup-loading')?.remove();
        root.inert = false;
        root.removeAttribute('aria-busy');
        root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#eaf8ff;color:#173d73;font:700 18px/1.4 system-ui,sans-serif;text-align:center"><div style="max-width:640px"><h1 style="margin:0 0 12px">Игра не запустилась</h1><p style="margin:0 0 16px">Сделайте скриншот отчёта ниже и отправьте его мне.</p><pre id="startup-error" style="max-height:45vh;overflow:auto;margin:0 0 20px;padding:12px;border-radius:10px;background:#fff;color:#55708f;font:600 12px/1.45 ui-monospace,monospace;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere"></pre><button type="button" style="padding:10px 16px;border:2px solid #247cf0;border-radius:10px;background:#fff;color:#174d7c;font:800 16px system-ui">Обновить</button></div></main>';
        const failure = error instanceof Error ? error : new Error(String(error || 'Неизвестная ошибка'));
        const details = root.querySelector('#startup-error');
        let webgl = 'неизвестно';
        try { webgl = document.createElement('canvas').getContext('webgl') ? 'доступен' : 'недоступен'; } catch { webgl = 'ошибка проверки'; }
        const audioContext = Object.getOwnPropertyDescriptor(window, 'AudioContext');
        const report = [
          `Ошибка: ${failure.name}: ${failure.message}`,
          `Стек: ${failure.stack || 'не передан браузером'}`,
          `URL: ${location.href}`,
          `Web Audio: AudioContext=${typeof window.AudioContext}, webkitAudioContext=${typeof window.webkitAudioContext}`,
          `AudioContext descriptor: ${audioContext ? `writable=${Boolean(audioContext.writable)}, configurable=${Boolean(audioContext.configurable)}` : 'нет'}`,
          `WebGL: ${webgl}`,
          `User-Agent: ${navigator.userAgent}`,
        ].join('\n\n');
        if (details) details.textContent = report;
        const reload = root.querySelector('button');
        if (reload) reload.addEventListener('click', () => window.location.reload());
      };
      const handleRuntimeError = (event) => {
        // These browser layout notices defer delivery; they are not fatal exceptions.
        if (!event.error && (
          event.message === 'ResizeObserver loop completed with undelivered notifications.'
          || event.message === 'ResizeObserver loop limit exceeded'
        )) return;
        window.removeEventListener('error', handleRuntimeError);
        showStartupError(event.error || event.message);
      };
      window.addEventListener('error', handleRuntimeError);
      window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason), { once: true });
      import('/src/main.ts').catch(showStartupError);
    </script>
  </body>
</html>
